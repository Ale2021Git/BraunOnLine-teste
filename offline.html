<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00A97A">
  <title>Offline - Braun OnLine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #00A97A, #007d5a);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }
    .icon {
      font-size: 90px;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .icon { animation: none; }
    }
    h1 {
      font-size: 1.9rem;
      margin-bottom: 14px;
      font-weight: 800;
    }
    p {
      opacity: 0.92;
      max-width: 340px;
      line-height: 1.6;
      margin-bottom: 28px;
      font-size: 1.05rem;
    }
    button {
      background: white;
      color: #00A97A;
      border: none;
      padding: 18px 36px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 1.05rem;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.96); }
    #status {
      min-height: 1.4em;
      margin-top: 18px;
      font-size: 0.95rem;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="icon" aria-hidden="true">📡</div>
  <h1>Você está offline</h1>
  <p>Não foi possível conectar à internet.<br>
  Abra o app uma vez com conexão para que ele passe a funcionar sem internet.</p>
  <button type="button" id="btn-retry">Tentar novamente</button>
  <div id="status" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var status = document.getElementById('status');

      function tryReload() {
        if (navigator.onLine) {
          location.reload();
        } else {
          status.textContent = 'Ainda sem conexão. Verifique a internet e tente novamente.';
        }
      }

      document.getElementById('btn-retry').addEventListener('click', tryReload);
      window.addEventListener('online', function () { location.reload(); });
    })();
  </script>
</body>
</html>
